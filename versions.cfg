[versions]
# Pins propios de genweb6.core para los tests (CI).
# La base es el KGS de Plone 6.0.15 (ver test_plone60.cfg); aqui solo van los
# pins que el KGS no fija o que hay que forzar. Mantener alineado con el
# versions.cfg de genweb6.buildout (rama plone_6_0_15).

# No usar una version publicada de genweb6.core
genweb6.core =

plone.session = 4.0.3
collective.easyform = 4.1.4
collective.z3cform.datagridfield = 3.0.0
prompt-toolkit = 3.0.30
ipython = 8.15.0
# pikepdf (genweb6.core) requiere Pillow>=10.0.1
Pillow = 11.0.0
# Fixed various
Products.PloneLDAP = 2.0.0a1
requests = 2.30.0
Products.LDAPMultiPlugins = 5.1
Products.LDAPUserFolder = 5.2
dataflake.cache = 3.2
dataflake.fakeldap = 4.2
eea.facetednavigation = 16.0a1
plone.formwidget.recaptcha = 2.2.0
plone.api = 2.3.0
node = 1.2.1
plone.app.mosaic = 3.2.2
# --- Plone 6.0.15: hotfixes de seguridad ---
# Advisory 2026-06-23 (TALES RCE, DoS iCalendar/RSS, DoS longitud title)
plone.app.contenttypes = 3.0.12
plone.app.dexterity = 3.2.3
plone.app.event = 5.2.4
plone.app.portlets = 5.0.8
RestrictedPython = 8.3
# Advisory 2026-06-05 (XSS RichText)
plone.app.textfield = 2.0.2
plone.restapi = 9.15.6
# --- Plone 6.0.15: pins heredados de la rama (pendientes de revalidar) ---
z3c.jbot = 2.0
plone.app.widgets = 4.0.1
plone.app.multilingual = 8.2.2
plone.app.z3cform = 4.7.7
# genweb6.gpaq >= 1.6 usa msal>=1.31 (cryptography<46); cryptography 44.0.0 es la del KGS 6.0.15
cryptography = 44.0.0
# pyquery 2.1 exige cssselect>=1.5; KGS 6.0.15 fija cssselect 1.2.0
pyquery = 2.0.1
# node.ext.zodb 2.x exige node>1.99; node 1.2.1 fijado por master
node.ext.zodb = 1.4
# plone.reload 5.x usa namespace nativo y rompe plone.* con namespaces pkg_resources
plone.reload = 4.0.0
# Paquetes sin pin en el KGS 6.0.15 que flotaban a versiones para Plone 6.1+; se dejan en las versiones que funcionaban
Products.PloneKeywordManager = 6.0.0
Products.PrintingMailHost = 1.1.7
plone.formwidget.autocomplete = 1.4.1
huey = 2.6.0
plone.app.blocks = 7.0.1
plone.app.drafts = 2.0.0
plone.app.standardtiles = 3.2.2
plone.app.tiles = 4.0.1
plone.jsonserializer = 0.9.11
zope.index = 7.0
zope.formlib = 6.1
zope.app.form = 6.1
odict = 1.9.0
plumber = 1.7
Products.ZODBMountPoint = 2.0
